name: Synthetic CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps .
      - run: python -m pip install --no-deps 'SimpleITK==2.5.6'
      - run: python -m pytest --junitxml=test-results.xml
      - name: Build and inspect structural-only wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/structural-wheel" .
          python tests/check_release_wheel.py "${RUNNER_TEMP}"/structural-wheel/*.whl
      - name: Installed CLI from outside checkout
        working-directory: /tmp
        run: neo-mri --help
      - run: neo-mri-t2-v1 policy
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-test-results
          path: test-results.xml
