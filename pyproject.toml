[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-mri"
version = "0.2.0rc1"
description = "Reviewed T1 and T2 structural MRI research workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "nilearn==0.11.1", "nibabel==5.3.2", "numpy==2.2.6", "scipy==1.15.2",
  "matplotlib==3.10.6", "pandas==2.2.3", "scikit-learn==1.6.1",
  "pillow==13.0.0", "threadpoolctl==3.7.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
anatomy = ["SimpleITK==2.5.6"]

[project.scripts]
neo-mri = "structural_cli:main"
neo-mri-lesion = "lesion_cli:main"
neo-mri-mask = "anatomy_review:main"
neo-mri-blink = "registration_blink:main"
neo-mri-extract = "brain_extract:main"
neo-mri-structural = "structural_multimodal:main"
neo-mri-t2-v1 = "t2_stable:main"

[tool.setuptools]
package-dir = {"" = "code"}
py-modules = ["anatomy_review", "anatomy_runtime_evidence", "anatomy_viewer_assets", "brain_extract", "hdbet_cpu", "multimodal_review", "registration_audit", "registration_blink", "registration_geometry", "state_io", "structural_cli", "structural_context", "structural_multimodal", "t1_preprocess", "t2_stable", "lesion_cli", "lesion_state", "lesion_workflow", "lesion_slicer", "lesion_synthstroke", "synthstroke_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
